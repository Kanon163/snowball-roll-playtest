<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover,maximum-scale=1,user-scalable=no"><title>雪球滚滚 · 异步挑战</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#233746;color:#edf5f7;font:18px system-ui}#stage{position:absolute;inset:0;overflow:hidden}@media (orientation:portrait){#stage{inset:0 auto auto 100%;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:top left;transform:rotate(90deg)}}canvas{width:100%;height:100%;display:block;touch-action:none}#load{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;background:radial-gradient(ellipse at 50% 116%,#316371,#182c46 70%,#101d31);color:#fff0cb;overflow:hidden}
#load[hidden]{display:none}#load:before{content:"";position:absolute;inset:-60px;background-image:radial-gradient(circle,#f4e6c3 1px,transparent 2px),radial-gradient(circle,#a4d5e2 1px,transparent 2px);background-size:77px 59px,109px 83px;background-position:20px 0,50px 30px;opacity:.48;animation:snow 5s linear infinite}
#load strong,#load small,#rail{position:relative}#load strong{font:900 clamp(28px,6vh,48px) system-ui;letter-spacing:.12em;text-shadow:0 3px 0 #734e3c}#rail{width:min(48vw,300px);height:15px;margin:22px 0 14px;border-radius:20px;background:#152c3a;border:2px solid #e2b675;box-shadow:0 -2px 0 #ffefcf,0 2px 6px #0f2732;overflow:hidden}
#bar{height:100%;width:7%;min-width:12px;border-radius:16px;background:repeating-linear-gradient(112deg,#78c5a3 0 14px,#bdf0c7 15px 24px,#80d4ad 25px 34px);animation:stripe 1.1s linear infinite;transition:width .25s ease}
@keyframes stripe{to{background-position:37px 0}}@keyframes snow{to{transform:translate(12px,59px)}}</style></head>
<body><main id="stage"><canvas aria-label="雪球滚滚异步挑战"></canvas><div id="load" role="status"><strong>雪球滚滚</strong><div id="rail"><div id="bar"></div></div><small>正在打开雪村</small></div></main>
<script>window.snowBoot=function(n,s){document.querySelector('#bar').style.width=(n*100)+'%';document.querySelector('#load small').textContent=s};let bootScripts=0;document.addEventListener('load',e=>{if(e.target.tagName==='SCRIPT'&&e.target.src&&++bootScripts<12)snowBoot(.07+bootScripts*.018,'正在打开雪村')},true);document.addEventListener('error',e=>{if(e.target.tagName==='SCRIPT')document.querySelector('#load small').textContent='雪村下载中断，请刷新重试'},true)</script>
